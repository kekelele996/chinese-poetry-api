server:
  port: 1279
  mode: release  # debug, release, test
  # Proxies allowed to set X-Forwarded-For (IPs or CIDRs). Requests from any other
  # address are identified by their TCP peer, so clients can't spoof their IP to
  # dodge the rate limiter. Defaults to loopback + private ranges when omitted;
  # override with TRUSTED_PROXIES (comma-separated, or "none").
  # trusted_proxies: ["127.0.0.1/32", "172.16.0.0/12"]

database:
  # Connection pool settings (0 = auto-detect based on CPU cores)
  # Auto-detection: max_open_conns = min(NumCPU, 50), max_idle_conns = max_open_conns/2
  # Manual override: set to specific values (e.g., 10, 20)
  max_open_conns: 0  # 0 = auto (recommended), or set manually
  max_idle_conns: 0  # 0 = auto (recommended), or set manually

rate_limit:
  enabled: true
  requests_per_second: 10
  burst: 20

graphql:
  playground: false  # Enable GraphQL Playground (set to true for development)
  introspection: true
  # Max query complexity; paginated fields count as child cost x pageSize
  complexity_limit: 5000
  # Structural query limits, enforced before any resolver runs (env overrides:
  # GRAPHQL_MAX_DEPTH / GRAPHQL_MAX_ALIASES / GRAPHQL_MAX_NODE_COUNT /
  # GRAPHQL_MAX_BODY_BYTES / GRAPHQL_COMPLEXITY_LIMIT)
  max_depth: 10         # max field nesting depth after fragment expansion
  max_aliases: 5        # max times one field may be selected via aliases per selection set
  max_node_count: 2000  # max selected fields in one operation
  max_body_bytes: 1048576  # max request body size in bytes (1 MiB)

search:
  max_results: 1000
  default_page_size: 20
