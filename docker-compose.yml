services:
  poetry-api:
    image: palemoky/chinese-poetry-api:latest
    container_name: poetry-api
    restart: unless-stopped
    # 与进程内 drain_delay(5s) + shutdown_timeout(20s) 对齐并留出余量，
    # 否则宽限期一到平台直接 SIGKILL，在途请求来不及自然结束。
    stop_grace_period: 30s
    env_file: .env
    ports:
      - "${PORT:-1279}:${PORT:-1279}"
    environment:
      - TZ=Asia/Shanghai
      # Optional: Override database connection pool (default: auto-detect based on CPU cores)
      # - DB_MAX_OPEN_CONNS=20
      # - DB_MAX_IDLE_CONNS=10
    volumes:
      - poetry-data:/app/data

volumes:
  poetry-data:
